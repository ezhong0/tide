global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'tide-dev'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway-service'
    static_configs:
      - targets: ['host.docker.internal:4000']
    metrics_path: '/metrics'

  - job_name: 'auth-service'
    static_configs:
      - targets: ['host.docker.internal:4001']
    metrics_path: '/metrics'

  - job_name: 'events-service'
    static_configs:
      - targets: ['host.docker.internal:4002']
    metrics_path: '/metrics'

  - job_name: 'realtime-service'
    static_configs:
      - targets: ['host.docker.internal:4003']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
