name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ============================================================================
  # CRITICAL CHECKS - These must pass
  # ============================================================================

  lint-critical:
    name: Lint (Critical Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint types package
        run: pnpm --filter @tide/types lint

      - name: Lint contracts package
        run: pnpm --filter @tide/contracts lint

      - name: Lint schemas package
        run: pnpm --filter @tide/schemas lint

      - name: Check formatting (critical files)
        run: prettier --check "packages/{types,contracts,schemas}/**/*.{ts,tsx}" "docs/**/*.md" "*.{json,yaml,yml}"

  typecheck-critical:
    name: Type Check (Critical Packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and typecheck types
        run: pnpm --filter @tide/types build

      - name: Build and typecheck contracts
        run: pnpm --filter @tide/contracts build

      - name: Build and typecheck schemas
        run: pnpm --filter @tide/schemas build

  test-critical:
    name: Test (Critical Packages)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - types
          - contracts
          - schemas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm --filter @tide/${{ matrix.package }}^... build

      - name: Run tests with coverage
        run: pnpm --filter @tide/${{ matrix.package }} test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage/
          retention-days: 7

  # ============================================================================
  # REQUIRED CHECKS SUMMARY
  # ============================================================================

  all-critical-checks-pass:
    name: ✅ All Critical Checks Pass
    runs-on: ubuntu-latest
    needs: [lint-critical, typecheck-critical, test-critical]
    if: always()
    steps:
      - name: Verify all critical checks passed
        run: |
          if [[ "${{ needs.lint-critical.result }}" != "success" ||
                "${{ needs.typecheck-critical.result }}" != "success" ||
                "${{ needs.test-critical.result }}" != "success" ]]; then
            echo "❌ One or more critical checks failed"
            echo "Lint: ${{ needs.lint-critical.result }}"
            echo "TypeCheck: ${{ needs.typecheck-critical.result }}"
            echo "Test: ${{ needs.test-critical.result }}"
            exit 1
          fi
          echo "✅ All critical checks passed successfully!"

  # ============================================================================
  # OPTIONAL CHECKS - Won't block PR/merge
  # ============================================================================

  lint-optional:
    name: Lint (Optional - Mocks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mocks package
        run: pnpm --filter @tide/mocks lint || echo "⚠️ Mocks lint failed (non-blocking)"

  test-optional:
    name: Test (Optional - Mocks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependencies
        run: pnpm --filter @tide/mocks^... build

      - name: Run mocks tests
        run: pnpm --filter @tide/mocks test || echo "⚠️ Mocks tests failed (non-blocking)"

  performance-optional:
    name: Performance Tests (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build || echo "⚠️ Some packages failed to build"

      - name: Run performance tests
        run: pnpm test:performance || echo "⚠️ Performance tests failed (non-blocking)"

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: packages/mocks/performance-results/
          retention-days: 7
