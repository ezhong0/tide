version: 2
updates:
  # Enable version updates for npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      # Group all minor and patch updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Group all development dependencies
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "jest*"
          - "typescript"
          - "ts-*"
        dependency-type: "development"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    assignees:
      - "edwardzhong"
    reviewers:
      - "edwardzhong"

  # Enable updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"
    assignees:
      - "edwardzhong"

  # Enable updates for Docker images (if Dockerfiles exist)
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "build"
    labels:
      - "docker"
      - "automated"
    assignees:
      - "edwardzhong"
    ignore:
      # Don't update Node.js base image automatically
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    commit-message:
      prefix: "build"
    labels:
      - "docker"
      - "automated"
    assignees:
      - "edwardzhong"
    ignore:
      # Don't update Node.js base image automatically
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]