# Supabase Project Configuration
# This config is for linking to your remote Supabase project
# OAuth providers are configured in the Supabase Dashboard, not here

project_id = "ozrocykjomgcuphicqpg"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54324
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54325
smtp_port = 54326
pop3_port = 54327

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://ozrocykjomgcuphicqpg.supabase.co"
additional_redirect_urls = ["exp://localhost:19000", "com.tide.app://", "tideapp://", "http://localhost:3000"]
jwt_expiry = 900
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Note: OAuth providers (Google, Microsoft) are configured in Supabase Dashboard
# Go to: Authentication > Providers

[realtime]
enabled = true
ip_version = "IPv4"
